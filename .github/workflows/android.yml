name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes the Android SDK and sdkmanager.
      # The older setup action tries to install the retired 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            CMDLINE_ROOT="$SDK_ROOT/cmdline-tools"
            if [ ! -d "$CMDLINE_ROOT" ]; then
              echo "Android command-line tools are missing: $CMDLINE_ROOT"
              exit 1
            fi
            SDKMANAGER="$(find "$CMDLINE_ROOT" -type f -name sdkmanager | sort -V | tail -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "Unable to locate sdkmanager within Android SDK"
              exit 1
            fi
            echo "Using $SDKMANAGER"
            "$SDKMANAGER" --licenses < /dev/null || true
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "Android 35 and build tools already installed"
          fi
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolvero-Caption-Lab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wolvero-Caption-Lab.apk
          if gh release view v1.4 >/dev/null 2>&1; then
            gh release upload v1.4 Wolvero-Caption-Lab.apk --clobber
          else
            gh release create v1.4 Wolvero-Caption-Lab.apk \
              --title "Wolvero Caption Lab 1.4" \
              --notes "Wolvero Caption Lab for Android. Download the APK, install it, and enter your own free Gemini and Tavily keys in the app. Never share your keys."
          fi
